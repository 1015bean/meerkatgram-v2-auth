server:
  port: ${APP_PORT}

spring:
  application:
    name: meerkatgram-v2-auth
    version: v1
  web:
    error:
      include-stacktrace: always
      include-message: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    defer-datasource-initialization: true
  sql:
    init:
      data-locations: classpath*:dummy/*.sql
      mode: always
      platform: all

# Springdoc Openapi
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  # MSA 서비스이므로 하위서버에는 직접 접속X
  # 대신 Gateway가 각 하위서버에서 만든 스웨거 정보를 받아 출력
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs
  open-api:
    servers:
      - url: ${GATEWAY_URI}
        description: ${APP_DESCRIPTION}

# Log
logging:
  file:
    name: logs/error.log
  level:
    root: info
    com.msameerkatgramv2auth.controllers: debug
    com.msameerkatgramv2auth.global.errors: debug

# JWT
jwt:
  secure: false
  issuer: meerkat@meerkat.kr
  type: JWT
  access-token-expiry: 100000000
  refresh-token-expiry: 1296000000
  refresh-token-cookie-name: refresh-token
  refresh-token-cookie-expiry: 1296000
  secret: ${JWT_SECRET}
  header-key: Authorization
  scheme: Bearer
  reissue-uri: /api/auth/reissue-token

# minio
minio:
  minio-endpoint: ${MINIO_ENDPOINT}  # 접속할 주소, API가 어느 MinIO 서버에 연결할지 지정
  minio-bucket: ${MINIO_BUCKET}      # 파일을 저장할 버킷(Bucket) 이름
  minio-access-key: ${MINIO_ACCESS_KEY}  # MinIO 로그인에 사용하는 아이디
  minio-secret-key: ${MINIO_SECRET_kEY}  # MinIO 로그인에 사용하는 비밀번호
  minio-profile-path: ${MINIO_PROFILE_PATH}   # 파일을 저장할 폴더(경로)
  allow-image-extensions: [
    "image/jpg",
    "image/jpeg",
    "image/png",
    "image/gif",
    "image/webp"
  ]